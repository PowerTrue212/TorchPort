[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchport"
version = "0.38.3"
description = "可验证的跨框架到 Jittor 自动迁移与国产算力适配平台"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "TorchPort Contributors" },
]
dependencies = [
  "numpy>=1.24,<2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
viz = [
  "matplotlib>=3.8",
]

[project.scripts]
torchport = "torchport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
per-file-ignores = { "benchmarks/repos/**/*.py" = ["I001"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
